services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount questions so YAML edits show up on refresh without a rebuild.
      - ./data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      RUNNER_URL: http://runner:8001
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    depends_on:
      runner:
        condition: service_healthy
    networks:
      - default
      - sandbox
    restart: unless-stopped

  runner:
    build:
      context: ./runner
    # Hardened sandbox: non-root, read-only rootfs, no capabilities, no
    # privilege escalation, capped pids/memory/cpu, and no internet access
    # (the `sandbox` network is internal-only).
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sandbox
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  # No gateway to the outside world: code executed in `runner` cannot reach
  # the internet or the host network.
  sandbox:
    internal: true
