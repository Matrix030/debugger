[project]
name = "debuglab"
version = "1.0.0"
description = "DebugLab - locally hosted Python debugging interview practice platform"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "httpx>=0.28.1",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "mypy==2.1.0",
    "ruff==0.15.13",
    "types-pyyaml==6.0.12.20260518",
    "types-markdown>=3.7",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "runner_service"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = [".", "runner"]

[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
